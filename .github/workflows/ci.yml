name: CI - Static Code Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff linter
      run: |
        echo "Running Ruff linter..."
        ruff check . --output-format=github

    - name: Run Black formatter check
      run: |
        echo "Running Black formatter check..."
        black --check --verbose .

    - name: Run MyPy type checker
      run: |
        echo "Running MyPy type checker..."
        mypy main.py --show-error-codes

    - name: Run tests (if any)
      run: |
        echo "Running tests..."
        pytest -v || echo "No tests found yet"

  test-api:
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test FastAPI application
      run: |
        echo "Testing FastAPI application startup..."
        timeout 5s uvicorn main:app --host 0.0.0.0 --port 8000 || exit_code=$?
        if [ ${exit_code:-0} -eq 124 ]; then
          echo "API started successfully (timeout as expected)"
          exit 0
        else
          echo "API failed to start"
          exit 1
        fi
